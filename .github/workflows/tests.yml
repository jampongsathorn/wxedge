name: wxedge-tests

# รันเฉพาะเมื่อ "โค้ด" เปลี่ยน — ข้อมูลที่บอท commit ทุก ~10 นาที ไม่ต้องรันเทสต์ซ้ำ
on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "deploy/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --quiet -r deploy/requirements.txt
      - name: รันชุดทดสอบ cheap_live (offline, ไม่ต่อเน็ต)
        run: python tests_live_v2.py

      - name: รันชุดทดสอบระบบโซ่ (gate · guard · push ชนกัน · watchdog)
        run: python tests_chain.py
