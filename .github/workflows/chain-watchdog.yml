# wxedge-chain-watchdog — เฝ้าโซ่เก็บข้อมูล: ถ้า heartbeat ค้างเกิน 25 นาที ให้ยกเลิก run ที่ค้าง + เริ่มโซ่ใหม่
#
# ทำไมต้องมี: ถ้าโซ่ค้าง (เช่น git rebase ชนกับ commit ที่ push เข้ามา) มันจะถือ concurrency lock ไว้
#            ทำให้ cron สำรอง */30 ต่อคิวไม่ได้ → ข้อมูลหยุดเก็บเงียบ ๆ งานนี้คือตัวปลดล็อกอัตโนมัติ
name: wxedge-chain-watchdog

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      stale_min:            # ใช้ทดสอบ E2E: 0 = บังคับให้ถือว่า "ตาย" แล้วทดสอบ cancel+ปลด state+dispatch
        description: "เกณฑ์ heartbeat ค้าง (นาที)"
        required: false
        default: "25"
      dry:
        description: "ทดลอง (ไม่ยิง API)"
        type: boolean
        required: false
        default: false

permissions:
  actions: write        # ยกเลิก run + dispatch
  contents: write       # อ่าน state + ปลด state ที่ค้าง (โซ่ถูกยกเลิกจะทิ้ง state ว่า "ยังมีโซ่")

concurrency:
  group: wxedge-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: ตรวจ heartbeat → รีสตาร์ตโซ่ที่ค้าง
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_MIN: ${{ inputs.stale_min || '25' }}
          DRY: ${{ inputs.dry && '1' || '0' }}
        run: bash deploy/chain_watchdog.sh
