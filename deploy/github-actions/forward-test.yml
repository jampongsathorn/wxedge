# ชุดรัน forward-test บน GitHub Actions (v4 — ทุก 10 นาทีรอบเวลาเข้าไม้ · Pages จาก repo นี้เอง)
#
# รอบงาน:
#   ทุก 10 นาที → gate ตัดสิน "เมืองไหนควรสแกน" ตาม時間 local ของแต่ละเมือง:
#       • entry 15:30–16:30 local → เก็บทุก 10 นาที (7 ตัวอย่าง/เมือง/วัน รอบเวลาตัดสินใจ 16:00)
#       • ctx   14:00–18:00 local → เก็บทุก 30 นาที (ราคาเส้นทางก่อน/หลังเข้าไม้)
#       • นอกนั้นข้าม → รอบที่ไม่มีเมือง = จบใน ~15 วิ
#   ทุกวัน 03:20 UTC → จักรวาล + วัด bid/ask + เติมเฉลย + รายงาน forward
#   หน้า monitor ถูกสร้างใหม่ + commit docs/ เมื่อ KPI เปลี่ยน → GitHub Pages (source = main /docs) เสิร์ฟให้เอง
#
# ทำไมต้องเป็น repo public: GitHub คิดนาที CI "ปัดขึ้นเป็นนาทีต่อรอบ" → cadence 10 นาที = 144 รอบ/วัน
#   ≈ 4,400 นาที/เดือน ซึ่งเกินโควตาฟรี 2,000 ของ repo ส่วนตัว · repo สาธารณะ = ไม่คิดนาที
name: wxedge-forward-test

on:
  schedule:
    - cron: "*/10 * * * *"      # ทุก 10 นาที (UTC)
    - cron: "20 3 * * *"        # รายวัน 03:20 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wxedge-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: เช็คว่ามีเมืองถึงเวลาไหม (ข้ามรอบเปล่า + เว้นระยะต่อเมือง)
        id: gate
        run: >-
          python3 deploy/gate.py
          --entry 15:30-16:30 --entry-gap 10
          --ctx 14:00-18:00 --ctx-gap 30
          >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true' || github.event.schedule == '20 3 * * *' || github.event_name == 'workflow_dispatch'
        with:
          python-version: "3.11"
          cache: pip

      - name: ติดตั้ง dependency (numpy ตัวเดียว)
        if: steps.gate.outputs.run == 'true' || github.event.schedule == '20 3 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r deploy/requirements.txt

      - name: "บันทึกราคาจริง (log v3: bid/ask · depth · obs · snapshot) — สแกนขนาน"
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          echo "โหมด ${{ steps.gate.outputs.mode }} · เมือง: ${{ steps.gate.outputs.cities }}"
          python cheap_live.py --log --workers 4 --cities "${{ steps.gate.outputs.cities }}"
          wc -l data/cheap_live_log.csv

      - name: รายวัน — จักรวาล + bid/ask + เติมเฉลย + รายงาน forward
        if: github.event.schedule == '20 3 * * *'
        run: |
          python -c "import cheap_live as C; C.build_universe(verbose=True)"
          python bidask_check.py --max-bins 90 || true
          python forward_resolve.py || true
          tail -20 reports/forward_report.md || true

      - name: "อัปเดตหน้า monitor (เมื่อ KPI เปลี่ยน) + commit กลับเข้า repo"
        id: commit
        if: always() && steps.gate.conclusion == 'success'
        run: |
          git config user.name  "wxedge-bot"
          git config user.email "wxedge-bot@users.noreply.github.com"
          git add -f data/cheap_live_log.csv data/universe.json data/bidask_probe.json data/forward_stats.json \
                     data/snapshots reports/bidask_check.md reports/forward_report.md || true

          # สร้างหน้า monitor ใหม่เฉพาะเมื่อตัวเลข KPI เปลี่ยน (กัน Pages build ถี่เกินจำเป็น)
          KPI_CHANGED=$(git diff --cached --name-only | grep -E 'cheap_live_log|universe|bidask_probe|forward_stats|reports/' || true)
          if [ -n "$KPI_CHANGED" ] || [ "${{ github.event.schedule }}" = "20 3 * * *" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python build_monitor.py --quiet --mode "${MODE:-full}" --skip-if-same --out docs/index.html --json-out docs/monitor.json || true
            git add -f docs
          fi

          if git diff --cached --quiet; then
            echo "ไม่มีข้อมูลใหม่"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "forward-test log $(date -u +'%Y-%m-%dT%H:%MZ') [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: สรุปในหน้า Actions
        if: always()
        run: |
          echo "แถวใน log: $(wc -l < data/cheap_live_log.csv 2>/dev/null || echo 0) · โหมด: ${{ steps.gate.outputs.mode }} · เมืองรอบนี้: ${{ steps.gate.outputs.cities }}"
          tail -3 data/cheap_live_log.csv 2>/dev/null || true
